name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Секреты недоступны в PR из форков — ревью только для веток этого репозитория
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Проведи ревью этого PR строго по skill `pr-review` из .claude/skills/pr-review/SKILL.md.
            Inline-комментарии оставляй через mcp__github_inline_comment__create_inline_comment.
            Итоговый вердикт обязательно отправь через `gh pr review` (--approve или --request-changes).
            Пиши на русском.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh issue view:*),Read,Grep,Glob"

      - name: Check verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Учитываем только вердикты: inline-комментарии создают ревью со state COMMENTED
          state=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and .commit_id == \"$SHA\"
                   and (.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\"))] | last | .state // \"NONE\"")
          case "$state" in
            APPROVED) echo "Ревью одобрено для $SHA" ;;
            CHANGES_REQUESTED) echo "::error::Ревьюер запросил изменения — смотри комментарии в PR"; exit 1 ;;
            *) echo "::error::Вердикт ревью не опубликован для $SHA — смотри лог шага Claude"; exit 1 ;;
          esac

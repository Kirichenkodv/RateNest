[project]
name = "ratenest"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0,<6.1",
    "django-modern-rest>=0.16.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.pytest_env]
DJANGO_SECRET_KEY = "test-only-secret-key"
DJANGO_ALLOWED_HOSTS = "localhost,127.0.0.1"
DATABASE_URL = "postgres://user:pass@localhost:5432/test_db"
REDIS_URL = "redis://localhost:6379/0"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.mypy]
python_version = "3.13"
strict = true # строгий режим проверок mypy
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true   # помогают mypy находить модули внутри проекта

[tool.django-stubs]
django_settings_module = "config.settings"


[[tool.mypy.overrides]]
module = ["django.core.exceptions", "django.core.exceptions.*"]
ignore_missing_imports = true
